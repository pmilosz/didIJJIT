<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>didIJJIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f6f0;--g5:#3f8a60;--g7:#2d6a4a;--g9:#1c3d2e;--ink:#1f2a24;--line:#dfe5e0;--mint:#e6efe9;--muted:#5d6b63;--sun:#f2b84b;--red:#a8432f}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
header{background:var(--g9);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header h1{font:28px "DM Serif Display",serif;margin:0;letter-spacing:.3px}
header h1 b{color:var(--sun);font-weight:400}
header .meta{color:#bcd3c5;font-size:13px;flex:1}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--g5)}
button.primary{background:var(--sun);border-color:var(--sun);color:var(--g9);font-weight:700;padding:9px 18px}
button.primary:disabled{opacity:.6;cursor:wait}
button.on{background:var(--g7);border-color:var(--g7);color:#fff}
button.danger{color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
nav .sep{width:1px;height:24px;background:var(--line);margin:0 6px}
nav input{margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:220px}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--mint);color:var(--g7);font-size:12px;font-weight:700}
button.on .count{background:rgba(255,255,255,.2);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.card.fresh{border-left:5px solid var(--sun)}
.card.st-aplikowalem{border-left:5px solid var(--g5)}
.card.st-nie_interesuje{opacity:.6}
.title{font-weight:700;font-size:16px;color:var(--g9);text-decoration:none}
.title:hover{text-decoration:underline}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.b-new{background:var(--sun);color:var(--g9)}
.b-app{background:var(--g5);color:#fff}
.sub{color:var(--muted);font-size:13.5px}
.sub b{color:var(--ink);font-weight:600}
.warn{grid-column:1/-1;background:#fdf3dc;border:1px solid #f0d69a;border-radius:8px;padding:6px 10px;font-size:13.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.note{grid-column:1/-1;display:flex;gap:6px}
.note input{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{background:var(--mint);color:var(--g9);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
td input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13.5px}
.k-wyslana{color:var(--g7);font-weight:700}.k-formularz{color:#9a6b00;font-weight:700}.k-obejrzana{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details div{font-size:12px;color:var(--muted);word-break:break-all}
form.add{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
form.add input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g9);color:#fff;padding:10px 18px;border-radius:10px;display:none}
h2{font:22px "DM Serif Display",serif;color:var(--g9);margin:8px 0}
.hint{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
.chip{font-size:13px;padding:4px 10px;border-radius:16px}
.tools select{margin-left:auto;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;background:#fff}
.cat{display:inline-block;font-size:11.5px;font-weight:600;color:var(--g7);background:var(--mint);padding:1px 7px;border-radius:5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:16px;color:var(--g9)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin-top:8px}
.grid label,.row label{display:flex;gap:7px;align-items:center;font-size:14px;cursor:pointer}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:8px}
.panel textarea,.panel input[type=number],.panel input[type=text]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.panel textarea{width:100%;min-height:38px;resize:vertical}
.ok{color:var(--g7);font-weight:700}.no{color:var(--red);font-weight:700}
code.path{display:block;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;word-break:break-all;font-size:13px}
ol li{margin:4px 0}
.banner{background:#fdf3dc;border:1px solid #f0d69a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.spin{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
.spin.big{width:42px;height:42px;border-width:5px;color:var(--g5)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{position:fixed;inset:0;background:rgba(248,246,240,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;color:var(--g9);font-size:16px}
.loading.on{display:flex}
.loading small{color:var(--muted);font-size:13.5px}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@media(max-width:700px){.card{grid-template-columns:1fr}.actions{justify-content:flex-start}nav input{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <h1 title="Did I Just Join IT?">didI<b>JJIT</b>?</h1>
  <div class="meta" id="meta">…</div>
  <button class="primary" id="refresh">Odśwież oferty</button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="view"></section>
</main>
<div class="toast" id="toast"></div>
<div class="loading" id="loading" role="status" aria-live="polite">
  <span class="spin big"></span>
  <b>Pobieram oferty z justjoin.it…</b>
  <small id="loading-time">0 s</small>
</div>
<script>
const TABS = [
  ["nowe", "Nowe"], ["aktywne", "Wszystkie"], ["przejrzane", "Przejrzane"],
  ["aplikowalem", "Aplikowałem"], ["nie_interesuje", "Nie interesuje"], ["wygasle", "Wygasłe"],
];
const STATUS = [["przejrzana", "Przejrzana"], ["aplikowalem", "Aplikowałem"], ["nie_interesuje", "Nie interesuje"], ["nowa", "Nowa"]];
const store = {get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
// adres z #zakładką (np. localhost:8765/#ustawienia) otwiera od razu tę zakładkę
const VIEWS_ALL = ["nowe", "aktywne", "przejrzane", "aplikowalem", "nie_interesuje", "wygasle", "aplikacje", "historia", "ustawienia", "wtyczka"];
let view = VIEWS_ALL.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("view", "nowe"), query = "", summary = null, meta = null;
let category = store.get("category", ""), sort = store.get("sort", "najnowsze");
const extVersion = () => document.documentElement.dataset.didijjitExtension;
const catLabel = (k) => meta?.categories?.[k] || k;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (iso) => iso ? new Date(iso).toLocaleString("pl-PL", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const day = (iso) => iso ? new Date(iso.length === 10 ? iso + "T12:00" : iso).toLocaleDateString("pl-PL") : "";
const today = () => new Date().toISOString().slice(0, 10);

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : r.statusText);
  return data;
}

async function loadSummary() {
  summary = await api("/api/summary");
  const l = summary.last_refresh;
  const c = summary.config;
  const scope = `${c.categories.join(", ")} · ${[...c.cities.map((x) => c.radius_km ? `${x} +${c.radius_km} km` : x), ...(c.remote ? ["zdalnie"] : [])].join(", ")} (${c.source})`;
  $("#meta").textContent = (l ? `Ostatnie odświeżenie: ${fmt(l.at)} · pobrano ${l.fetched}, nowych ${l.added}` : "Jeszcze nie pobrano ofert — kliknij „Odśwież oferty”.") + " · " + scope;
  renderNav();
}

function renderNav() {
  const c = summary?.counts || {};
  $("#nav").innerHTML = TABS.map(([k, label]) => `<button data-v="${k}" class="${view === k ? "on" : ""}">${label}<span class="count">${c[k] ?? 0}</span></button>`).join("")
    + `<span class="sep"></span><button data-v="aplikacje" class="${view === "aplikacje" ? "on" : ""}">Moje aplikacje<span class="count">${summary?.applications ?? 0}</span></button>`
    + `<button data-v="historia" class="${view === "historia" ? "on" : ""}">Import z historii</button>`
    + `<span class="sep"></span><button data-v="ustawienia" class="${view === "ustawienia" ? "on" : ""}">⚙ Ustawienia</button>`
    + `<button data-v="wtyczka" class="${view === "wtyczka" ? "on" : ""}">Wtyczka ${extVersion() ? "✓" : ""}</button>`
    + (["aplikacje", "historia", "ustawienia", "wtyczka"].includes(view) ? "" : `<input id="q" placeholder="Szukaj: stanowisko, firma, miasto" value="${esc(query)}">`);
  document.querySelectorAll("#nav button").forEach((b) => b.onclick = () => { view = b.dataset.v; store.set("view", view); history.replaceState(null, "", "#" + view); renderNav(); render(); });
  const q = $("#q");
  if (q) q.oninput = () => { query = q.value; clearTimeout(q._h); q._h = setTimeout(render, 250); };
}

async function render() {
  if (view === "aplikacje") return renderApplications();
  if (view === "historia") return renderHistory();
  if (view === "ustawienia") return renderSettings();
  if (view === "wtyczka") return renderExtension();
  const data = await api(`/api/offers?view=${view}&q=${encodeURIComponent(query)}&category=${encodeURIComponent(category)}&sort=${sort}`);
  const rows = data.offers, cats = data.categories;
  const total = Object.values(cats).reduce((a, b) => a + b, 0);
  const banner = !extVersion() && store.get("hideExtBanner", "") !== "1"
    ? `<div class="banner"><span>Zainstaluj wtyczkę do przeglądarki — na justjoin.it pokaże, czy już aplikowałeś do firmy.</span>
       <button data-go="wtyczka">Jak zainstalować</button><button data-hide>Nie pokazuj</button></div>` : "";
  const tools = `<div class="tools">
    <button class="chip ${category ? "" : "on"}" data-cat="">Wszystkie kategorie<span class="count">${total}</span></button>
    ${Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<button class="chip ${category === k ? "on" : ""}" data-cat="${esc(k)}">${esc(catLabel(k))}<span class="count">${n}</span></button>`).join("")}
    <select id="sort" title="Sortowanie">
      ${[["najnowsze", "Najnowsze"], ["kategoria", "Wg kategorii"], ["firma", "Wg firmy"], ["miasto", "Wg miasta"]].map(([k, l]) => `<option value="${k}" ${sort === k ? "selected" : ""}>${l}</option>`).join("")}
    </select></div>`;
  $("#view").innerHTML = banner + tools + (rows.length ? rows.map(cardHtml).join("") : `<div class="empty">Brak ofert w tym widoku.</div>`);
  document.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { category = b.dataset.cat; store.set("category", category); render(); });
  $("#sort").onchange = (e) => { sort = e.target.value; store.set("sort", sort); render(); };
  document.querySelector("[data-go]")?.addEventListener("click", () => { view = "wtyczka"; store.set("view", view); renderNav(); render(); });
  document.querySelector("[data-hide]")?.addEventListener("click", () => { store.set("hideExtBanner", "1"); render(); });
  document.querySelectorAll("[data-st]").forEach((b) => b.onclick = () => setStatus(b.closest(".card").dataset.g, b.dataset.st));
  document.querySelectorAll(".note input").forEach((i) => i.onchange = () => api(`/api/offers/${i.closest(".card").dataset.g}/note`, {method: "POST", body: {note: i.value}}).then(() => toast("Notatka zapisana")));
}

function cardHtml(o) {
  const isNew = o.status === "nowa";
  const hist = o.company_history.map((a) => `${day(a.applied_at)}${a.title ? " – " + esc(a.title) : ""}`).join("; ");
  return `<div class="card st-${o.status} ${isNew && o.fresh ? "fresh" : ""}" data-g="${o.guid}">
    <div>
      <a class="title" href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a>
      ${isNew ? `<span class="badge b-new">${o.fresh ? "Nowa" : "Nieprzejrzana"}</span>` : ""}
      ${o.status === "aplikowalem" ? `<span class="badge b-app">Aplikowałem ${day(o.status_at)}</span>` : ""}
      <div class="sub"><span class="cat">${esc(catLabel(o.category))}</span> <b>${esc(o.company)}</b> · ${esc(o.city)} · ${esc(o.workplace)} · ${esc(o.experience)}</div>
      <div class="sub">${o.salary ? esc(o.salary) + " · " : ""}opublikowana ${fmt(o.published_at)}</div>
    </div>
    <div class="actions">
      ${STATUS.filter(([k]) => k !== o.status && !(k === "nowa" && o.status === "nowa")).map(([k, l]) => `<button data-st="${k}">${l}</button>`).join("")}
    </div>
    ${hist ? `<div class="warn">Już aplikowałeś do tej firmy: ${hist}</div>` : ""}
    <div class="note"><input placeholder="Notatka (zapis po wyjściu z pola)" value="${esc(o.note)}"></div>
  </div>`;
}

async function setStatus(guid, status) {
  let body = {status};
  if (status === "aplikowalem") {
    const d = prompt("Data aplikacji (RRRR-MM-DD):", today());
    if (d === null) return;
    body.applied_at = d;
  }
  try { await api(`/api/offers/${guid}/status`, {method: "POST", body}); } catch (e) { return toast(e.message); }
  await loadSummary(); render();
}

async function renderApplications() {
  const rows = await api("/api/applications");
  const src = {reczna: "ręcznie", historia: "z historii", brave: "z historii", oferta: "z listy ofert", wtyczka: "z wtyczki"};
  $("#view").innerHTML = `<h2>Moje aplikacje</h2>
    <p class="hint">Wszystkie miejsca, do których wysłałeś CV. Z tej listy powstaje ostrzeżenie „już aplikowałeś do tej firmy”.</p>
    <form class="add" id="add">
      <input name="company" placeholder="Firma *" required>
      <input name="title" placeholder="Stanowisko">
      <input name="url" placeholder="Link do oferty">
      <input name="applied_at" type="date" value="${today()}" required>
      <input name="note" placeholder="Notatka">
      <button class="on">Dodaj aplikację</button>
    </form>
    <table><tr><th>Data</th><th>Firma</th><th>Stanowisko</th><th>Źródło</th><th>Notatka</th><th></th></tr>
    ${rows.map((a) => `<tr><td>${day(a.applied_at)}</td><td><b>${esc(a.company)}</b></td>
      <td>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title || a.url)}</a>` : esc(a.title)}</td>
      <td>${src[a.source] || a.source}</td><td>${esc(a.note)}</td>
      <td><button class="danger" data-del="${a.id}">Usuń</button></td></tr>`).join("")}
    </table>`;
  $("#add").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { await api("/api/applications", {method: "POST", body: f}); } catch (err) { return toast(err.message); }
    toast("Dodano"); await loadSummary(); render();
  };
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm("Usunąć ten wpis?")) return;
    await api(`/api/applications/${b.dataset.del}`, {method: "DELETE"}); await loadSummary(); render();
  });
}

async function renderHistory() {
  $("#view").innerHTML = `<div class="empty">Czytam kopię historii przeglądarek…</div>`;
  let data;
  try { data = await api("/api/history/candidates"); } catch (e) { $("#view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const kinds = {wyslana: "Wysłana (strona „dziękujemy”)", formularz: "Otwarty formularz", obejrzana: "Tylko obejrzana"};
  $("#view").innerHTML = `<h2>Import z historii przeglądarek</h2>
    <p class="hint">Przeglądarki: ${esc(data.browsers.join(", "))} · profile: ${data.profiles}. Zaznacz pozycje, do których naprawdę wysłałeś CV, i popraw firmę lub stanowisko.
    Kliknięcie „Zapisz” doda zaznaczone do „Moich aplikacji”, a niezaznaczone oznaczy jako sprawdzone, więc nie pojawią się ponownie.
    Pozycje „tylko obejrzana” są z ostatnich 60 dni.</p>
    ${data.items.length ? `<table><tr><th></th><th>Ślad</th><th>Data</th><th>Firma</th><th>Stanowisko</th><th>Link</th></tr>
    ${data.items.map((c, i) => `<tr data-i="${i}">
      <td><input type="checkbox" ${c.kind === "wyslana" ? "checked" : ""}></td>
      <td class="k-${c.kind}">${kinds[c.kind]}</td>
      <td><input name="applied_at" type="date" value="${c.date}"></td>
      <td><input name="company" value="${esc(c.company)}" placeholder="uzupełnij"></td>
      <td><input name="title" value="${esc(c.title)}"></td>
      <td><a href="${esc(c.url)}" target="_blank" rel="noopener">otwórz</a>
        ${c.evidence.length ? `<details><summary>ślady</summary><div>${c.evidence.map(esc).join("<br>")}</div></details>` : ""}</td>
    </tr>`).join("")}</table>
    <p><button class="primary" id="save">Zapisz</button></p>` : `<div class="empty">Nic nowego w historii — wszystko już sprawdzone.</div>`}`;
  const save = $("#save");
  if (!save) return;
  save.onclick = async () => {
    const items = [], dismiss = [];
    document.querySelectorAll("tr[data-i]").forEach((tr) => {
      const c = data.items[tr.dataset.i];
      const val = (n) => tr.querySelector(`[name=${n}]`).value;
      if (tr.querySelector("[type=checkbox]").checked) items.push({company: val("company"), title: val("title"), url: c.url, applied_at: val("applied_at"), history_key: c.key});
      else dismiss.push(c.key);
    });
    const missing = items.filter((i) => !i.company.trim());
    if (missing.length) return toast(`Uzupełnij firmę w ${missing.length} zaznaczonych pozycjach`);
    if (!confirm(`Dodać ${items.length} aplikacji i oznaczyć ${dismiss.length} pozycji jako sprawdzone?`)) return;
    try { const r = await api("/api/history/import", {method: "POST", body: {items, dismiss}}); toast(`Dodano ${r.imported}, pominięto ${r.dismissed}`); } catch (e) { return toast(e.message); }
    await loadSummary(); render();
  };
}

async function renderSettings() {
  const d = await api("/api/settings");
  const c = d.config;
  const box = (name, k, label, on) => `<label><input type="checkbox" name="${name}" value="${esc(k)}" ${on ? "checked" : ""}>${esc(label)}</label>`;
  const small = Object.keys(d.cities).filter((k) => !d.big_cities.includes(k));
  $("#view").innerHTML = `<h2>Ustawienia</h2>
    <p class="hint">Zapisywane do pliku <b>config.toml</b> w folderze programu (można go też edytować ręcznie). Po zapisaniu kliknij „Odśwież oferty”.</p>
    <form id="settings">
    <div class="panel"><h3>Kategorie</h3>
      <div class="grid">${Object.entries(d.categories).map(([k, l]) => box("categories", k, l, c.categories.includes(k))).join("")}</div></div>
    <div class="panel"><h3>Miasta</h3><p class="hint">Oferty stacjonarne i hybrydowe z tych miejsc.</p>
      <div class="grid">${d.big_cities.map((k) => box("cities", k, d.cities[k], c.cities.includes(k))).join("")}</div>
      <details ${small.some((k) => c.cities.includes(k)) ? "open" : ""}><summary style="margin-top:10px">Mniejsze miasta</summary>
      <div class="grid">${small.map((k) => box("cities", k, d.cities[k], c.cities.includes(k))).join("")}</div></details>
      <div class="row"><label>Promień: <input type="number" name="radius_km" min="0" max="500" value="${c.radius_km}" style="width:80px"> km</label>
        <span class="hint" style="margin:0">0 = tylko same miasta. Promień łapie też oferty z „Gdansk” bez polskich znaków.</span></div></div>
    <div class="panel"><h3>Tryb pracy i doświadczenie</h3>
      <div class="row">${box("remote", "1", "Praca w pełni zdalna z całej Polski", c.remote)}${box("only_poland", "1", "Tylko oferty z Polski", c.only_poland)}</div>
      <div class="row">${Object.entries(d.experience).map(([k, l]) => box("experience", k, l, c.experience.includes(k))).join("")}
        <span class="hint" style="margin:0">nic nie zaznaczone = wszystkie poziomy</span></div></div>
    <div class="panel"><h3>Filtry</h3><p class="hint">Słowa i firmy oddzielaj przecinkami.</p>
      <label>Stanowisko musi zawierać jedno z:<textarea name="include_keywords" placeholder="np. backend, developer">${esc(c.include_keywords.join(", "))}</textarea></label>
      <label>Pomijaj stanowiska ze słowami:<textarea name="exclude_keywords" placeholder="np. intern, staż, lead">${esc(c.exclude_keywords.join(", "))}</textarea></label>
      <label>Pomijaj firmy:<textarea name="exclude_companies" placeholder="np. Firma A, Firma B">${esc(c.exclude_companies.join(", "))}</textarea></label></div>
    <div class="panel"><h3>Zaawansowane</h3>
      <div class="row"><label>Port programu: <input type="number" name="port" min="1024" max="65535" value="${c.port}" style="width:100px"></label>
      <span class="hint" style="margin:0">zmiana wymaga ponownego uruchomienia programu i ustawienia tego samego portu w opcjach wtyczki</span></div></div>
    <p><button class="primary">Zapisz ustawienia</button></p></form>`;
  $("#settings").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const all = (n) => [...f.querySelectorAll(`[name=${n}]:checked`)].map((i) => i.value);
    const words = (n) => f.querySelector(`[name=${n}]`).value.split(",").map((x) => x.trim()).filter(Boolean);
    const body = {
      categories: all("categories"), cities: all("cities"), experience: all("experience"),
      radius_km: Number(f.radius_km.value) || 0, remote: f.querySelector("[name=remote]").checked,
      only_poland: f.querySelector("[name=only_poland]").checked, port: Number(f.port.value) || 8765,
      include_keywords: words("include_keywords"), exclude_keywords: words("exclude_keywords"), exclude_companies: words("exclude_companies"),
    };
    try {
      const r = await api("/api/settings", {method: "POST", body});
      toast(r.restart_needed ? "Zapisano. Uruchom program ponownie, żeby zmienić port." : "Zapisano — teraz kliknij „Odśwież oferty”.");
      await loadSummary();
    } catch (err) { toast(err.message); }
  };
}

async function renderExtension() {
  const d = await api("/api/extension");
  const v = extVersion();
  const browsers = [["Brave", "brave://extensions"], ["Chrome", "chrome://extensions"], ["Edge", "edge://extensions"], ["Opera", "opera://extensions"], ["Vivaldi", "vivaldi://extensions"]];
  $("#view").innerHTML = `<h2>Wtyczka do przeglądarki</h2>
    <div class="panel">${v ? `<span class="ok">✓ Wtyczka działa w tej przeglądarce (wersja ${esc(v)})</span>${v !== d.version ? ` — dostępna nowsza wersja ${esc(d.version)}: przeładuj ją na stronie rozszerzeń.` : ""}`
      : `<span class="no">Wtyczka nie jest zainstalowana w tej przeglądarce.</span>`}
      <p class="hint" style="margin-bottom:0">Na stronie oferty justjoin.it wtyczka pokazuje pasek: zielony — już aplikowałeś na tę ofertę, żółty — aplikowałeś do tej firmy na inne stanowisko.
      Po kliknięciu „Aplikuj / Apply” zapyta, czy zapisać aplikację. Działa, gdy program didIJJIT jest uruchomiony.</p></div>
    <div class="panel"><h3>Brave, Chrome, Edge, Opera, Vivaldi</h3><ol>
      <li>Otwórz stronę rozszerzeń (wklej adres w pasek przeglądarki): ${browsers.map(([n, u]) => `${n} <code>${u}</code>`).join(", ")}.</li>
      <li>Włącz <b>Tryb dewelopera</b> (Developer mode).</li>
      <li>Kliknij <b>Załaduj rozpakowane</b> (Load unpacked) i wskaż folder:
        <code class="path" id="extpath">${esc(d.path)}</code><button id="copy">Kopiuj ścieżkę</button></li>
      <li>Wróć tutaj i odśwież stronę — przy zakładce „Wtyczka” pojawi się ✓.</li></ol></div>
    <div class="panel"><h3>Firefox (121+)</h3><ol>
      <li>Otwórz <code>about:debugging#/runtime/this-firefox</code> → <b>Załaduj tymczasowy dodatek</b> → wskaż plik <code>manifest.json</code> w folderze powyżej.</li>
      <li>W <code>about:addons</code> → didIJJIT → <b>Uprawnienia</b> zezwól na justjoin.it i localhost.</li>
      <li>Firefox usuwa tymczasowe dodatki po zamknięciu przeglądarki.</li></ol></div>
    <div class="panel"><h3>Inny komputer?</h3><p class="hint" style="margin:0">Pobierz wtyczkę jako ZIP, rozpakuj i wskaż rozpakowany folder:
      <a href="/didIJJIT-extension.zip">didIJJIT-extension-${esc(d.version)}.zip</a></p></div>`;
  $("#copy").onclick = () => navigator.clipboard.writeText(d.path).then(() => toast("Skopiowano ścieżkę"), () => toast("Zaznacz ścieżkę i skopiuj ręcznie"));
}

$("#refresh").onclick = async () => {
  const b = $("#refresh"), box = $("#loading"), t0 = Date.now();
  b.disabled = true; b.innerHTML = `<span class="spin"></span> Pobieram…`;
  box.classList.add("on");
  // licznik sekund — przy promieniu pobieranie całej Polski trwa dłużej, więc widać, że coś się dzieje
  const tick = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    $("#loading-time").textContent = `${sec} s` + (sec > 8 ? " · przy dużym promieniu lub wielu kategoriach to może chwilę potrwać" : "");
  }, 500);
  try { const r = await api("/api/refresh", {method: "POST"}); toast(`Pobrano ${r.fetched} ofert, nowych: ${r.added}`); }
  catch (e) { toast(e.message); }
  clearInterval(tick); box.classList.remove("on"); $("#loading-time").textContent = "0 s";
  b.disabled = false; b.textContent = "Odśwież oferty";
  await loadSummary(); render();
};

api("/api/settings").then((d) => { meta = d; }).catch(() => {}).finally(() => loadSummary().then(render));
</script>
</body>
</html>
